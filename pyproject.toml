[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurohive"
version = "0.1.0"
description = "Autonomous Multi-Agent Swarm Orchestrator & Sandboxed Code Execution Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Youssef El-Sayed (EngJoDev)"}
]
keywords = [
    "multi-agent",
    "ai-agents",
    "agent-swarm",
    "code-execution",
    "sandboxing",
    "llm-orchestrator",
    "autonomous-agents",
    "react-framework"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "click>=8.1.0",
    "requests>=2.31.0"
]

[project.scripts]
neurohive = "neurohive.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurohive*"]
